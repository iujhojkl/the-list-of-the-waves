<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>List of The Waves</title>

        <link rel="icon" href="/list_icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        
        <link rel="stylesheet" type="text/css" href="/css/reset.css" />
        <link rel="stylesheet" type="text/css" href="/css/main.css" />

        <script src="https://unpkg.com/vue@3.2.31/dist/vue.global.js"></script>
        <script src="https://unpkg.com/vue-router@4.0.14/dist/vue-router.global.prod.js"></script>
        <script type="module" src="/js/main.js"></script>
    </head>
    <body id="app" :class="{ dark: store.dark }">
        <header class="navbar">
            <div class="navbar__container">
                <div class="logo">
                    <span class="logo__title">List of the Waves</span>
                    <span class="logo__badge">v1.0.0</span>
                </div>

                <nav class="nav">
                    <div class="nav__links">
                        <router-link class="nav__tab" to="/">List</router-link>
                        <router-link class="nav__tab" to="/leaderboard">Leaderboard</router-link>
                        <router-link class="nav__tab" to="/roulette">Roulette</router-link>
                    </div>

                    <div class="nav__actions">
                        <button
                            class="icon-btn"
                            @click.prevent="store.toggleDark()"
                            :aria-label="store.dark ? 'Switch to light mode' : 'Switch to dark mode'"
                        >
                            <img
                                :src="store.dark ? '/assets/light.svg' : '/assets/dark.svg'"
                                alt=""
                            />
                        </button>
                        
                        <a 
                            class="icon-btn" 
                            href="https://discord.gg/dsaX8VpAG" 
                            target="_blank" 
                            aria-label="Discord Community"
                        >
                            <img src="/assets/discord.svg" alt="Discord" />
                        </a>

                        <a
                            class="btn btn--primary"
                            href="https://forms.gle/FgGLu6rP2GokjXPW8"
                            target="_blank"
                        >
                            Submit Record
                        </a>
                    </div>
                </nav>
            </div>
        </header>

        <main class="main-content">
            <router-view></router-view>
        </main>
    </body>
</html>
